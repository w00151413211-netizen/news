# 每天自动抓取新闻并更新网站（北京时间 08:00 / 15:00 / 20:00，共三次）
# 这个文件由 aggregate.py 自动维护，请勿手工改回旧版本。
name: 每日民航新闻

on:
  schedule:
    - cron: "0 0,7,12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  models: read                  # 调用 GitHub 免费 AI 接口做翻译

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 抓取新闻并生成网页
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python aggregate.py
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ .github/workflows/daily.yml
          git diff --staged --quiet || git commit -m "更新新闻 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
      - name: 上传到 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
