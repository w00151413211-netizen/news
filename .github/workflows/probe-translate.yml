name: probe-translate
on:
  workflow_dispatch:
permissions:
  contents: write
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 测试翻译接口
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 1) models.github.ai/inference/chat/completions ==="
          curl -sS -i --max-time 40 -X POST "https://models.github.ai/inference/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"say OK"}],"max_tokens":10}' | head -c 900
          echo ""
          echo "=== 2) models.github.ai/inference/v1/chat/completions ==="
          curl -sS -i --max-time 40 -X POST "https://models.github.ai/inference/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"say OK"}],"max_tokens":10}' | head -c 500
          echo ""
          echo "=== 3) Google gtx single ==="
          curl -sS -i --max-time 20 "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=aircraft" | head -c 500
          echo ""
          echo "=== 4) Google dict-chrome-ex ==="
          curl -sS -i --max-time 20 "https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=en&tl=zh-CN&q=aircraft" | head -c 500
          echo ""
          echo "=== 5) MyMemory ==="
          curl -sS -i --max-time 20 "https://api.mymemory.translated.net/get?q=aircraft&langpair=en%7Czh-CN" | head -c 500
          echo ""
          echo "=== DONE ==="
